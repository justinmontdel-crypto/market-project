<app-header></app-header>
<section class="products">
  <h2>Todos los productos</h2>
  <div class="products__filter">
    <button class="products__filter-btn" [class.products__filter-btn--active]="selectedCategory() === 'Verduras'" (click)="selectCategory('Verduras')">Verduras</button>
    <button class="products__filter-btn" [class.products__filter-btn--active]="selectedCategory() === 'Frutas'" (click)="selectCategory('Frutas')">Frutas</button>
    <button class="products__filter-btn" [class.products__filter-btn--active]="selectedCategory() === 'Zumos'" (click)="selectCategory('Zumos')">Zumos</button>
  </div>

  <div class="products__container">
    <h3>
      {{ totalProducts() }}
      @if (totalProducts() === 1) {
      resultado de producto
      } @else {
      resultados de producto
      }
    </h3>

    <div class="products__grid">
      @for (product of filteredProducts(); track product.id) {
      <product-card [product]="product" class="products__card"></product-card>
      }
    </div>
  </div>
</section>
